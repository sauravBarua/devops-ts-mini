# docker-compose.yml
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: devops-ts-mini:0.1.0
    container_name: devops-ts-mini-container
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
    restart: unless-stopped